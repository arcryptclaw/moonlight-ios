name: Build IPA

on:
  push:
    branches:
      - touchpad-1to1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned IPA (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Build for device without signing
        run: |
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          # Own bundle id and name, so it installs beside the App Store Moonlight
          OWNER_ID=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier io.github.${OWNER_ID}.moonlight-touchpad" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Moonlight TP" "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Moonlight-TP.ipa Payload
          ls -lh Moonlight-TP.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-TP-ipa
          path: Moonlight-TP.ipa
          if-no-files-found: error
